# https://goframe.org/docs/web/server-config-file-template
server:
  address: ":12800"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  path: "./logs"        # 日志目录（相对或绝对路径）
  file: "{Y-m-d}.log"   # 按天滚动
  level: "all"          # 日志级别：all | debug | info | warning | error
  stdout: true          # 是否同时输出到控制台
  rotateExpire: "7d"    # 日志保留时间
  rotateBackup: 10      # 最多保留文件数
  rotateSize: "50M"     # 单文件最大大小

# https://goframe.org/docs/core/gdb-config-file
database:
  default:
    link: ""


jwt:
  secret: ""

admin:
  users:
    - username: ""
      password: ""

rsa:
  server:
    public:
    private:
  client:
    public:
    private:

xiaozhi:
  secret_key:
  generate_license_token:

ai:
  # IP/hostname of this server, sent to device via OTA so it knows where to connect.
  local_host: "192.168.1.100"
  local_port: 12800
  # Connect to Home Assistant for smart-home tools and background tasks.
  ha_enabled: true
  conversation_history_enabled: false
  conversation_history_days: 90
  conversation_context_messages: 20
  conversation_idle_seconds: 0
  stt_language: "ko"
  stackchan_motion_speed: 180
  stackchan_motion_step_delay_ms: 220
  stackchan_expression_colors: '{"calm":[45,24,120],"happy":[168,60,130],"thinking":[80,50,168],"shy":[168,70,120],"pouty":[168,20,45],"surprised":[120,90,168],"sad":[20,40,168],"sleepy":[35,20,90]}'
  # Optional direct HA bridge for standalone runtimes; disabled by default.
  standalone_ha_enabled: false
  standalone_ha_url: ""
  standalone_ha_token: ""
  ota_https_enabled: true
  settings_listen_address: ":8099"
  settings_auth_token: ""
  # Home Assistant MCP WebSocket URL (ha-mcp-for-stackchan integration).
  ha_mcp_url: "ws://homeassistant.local:8123/api/ws_mcp_server/ws"
  # HA Long-Lived Access Token (create in HA → Profile → Long-Lived Access Tokens).
  ha_mcp_token: ""
  background_tasks_enabled: false
  background_agent_base_url: "https://api.openai.com"
  background_agent_api_key: ""
  background_agent_model: ""
  background_agent_timeout_seconds: 300
  # Upstream Xiaozhi OTA URL used to fetch real WebSocket credentials.
  upstream_ota_url: "https://api.tenclass.net/xiaozhi/ota/"
